# ---------------------------------------------------------------------------
# Pearls AQI Predictor — reference configuration.
# Copy to config/config.yaml and edit. Environment variables (see .env.example)
# override the `location`, provider, and backend settings at load time.
#
# Adding a new city is a config-only change: add an entry under `cities` and set
# `location.city` to its key (or pass --city on the CLI scripts).
# ---------------------------------------------------------------------------
project:
  name: pearls-aqi-predictor
  # Semantic version of the feature-engineering logic. Bump when the feature set
  # changes so stored rows remain traceable to the code that produced them.
  feature_pipeline_version: "1.0.0"

# Active location. `city` must match a key under `cities`.
location:
  city: Karachi
  country: Pakistan
  latitude: 24.8607
  longitude: 67.0011
  timezone: Asia/Karachi

# Known cities. Add entries here to support new locations without code changes.
cities:
  Karachi:
    country: Pakistan
    latitude: 24.8607
    longitude: 67.0011
    timezone: Asia/Karachi
  Lahore:
    country: Pakistan
    latitude: 31.5204
    longitude: 74.3587
    timezone: Asia/Karachi
  Delhi:
    country: India
    latitude: 28.6139
    longitude: 77.2090
    timezone: Asia/Kolkata

forecast:
  horizon_hours: 72
  frequency: hourly
  # Direct multi-horizon: one model output per horizon hour (t+1 .. t+72).
  strategy: direct
  # Predictions below/above these bounds are clipped (US EPA AQI range).
  min_aqi: 0
  max_aqi: 500

data:
  historical_days: 730
  # AQI standard used as the prediction target and throughout the app.
  aqi_standard: us_epa
  # Whether the target AQI is computed locally from pollutant concentrations
  # (recommended, provider-independent) or taken from the provider's own index.
  target_source: local_computed  # local_computed | provider

providers:
  air_quality: openmeteo   # openmeteo | openweather | sample
  weather: openmeteo       # openmeteo | openweather | sample
  request_timeout_seconds: 20
  max_retries: 4
  backoff_seconds: 1.5
  # Days per request batch when backfilling (provider rate-limit friendly).
  batch_days: 30
  # Persist raw JSON payloads under artifacts/raw/ (optional).
  store_raw_payloads: false

feature_store:
  backend: local           # local | hopsworks
  local_dir: data/local/feature_store
  # Feature-group names (and versions) — kept in config so schema changes are
  # explicit and traceable.
  groups:
    raw_air_quality: { name: raw_air_quality, version: 1 }
    raw_weather: { name: raw_weather, version: 1 }
    aqi_features: { name: aqi_features, version: 1 }
    forecast_inputs: { name: forecast_inputs, version: 1 }
    predictions: { name: model_predictions, version: 1 }
    monitoring: { name: model_monitoring, version: 1 }

model_registry:
  backend: local           # local | hopsworks
  local_dir: artifacts/models

features:
  # Feature-engineering knobs. Every feature must be computable at prediction
  # time (no future leakage).
  target_columns: [aqi]
  lag_hours: [1, 3, 6, 12, 24, 48, 72]
  rolling_windows: [3, 6, 12, 24, 48, 72]
  rolling_stats: [mean, min, max, std, median]
  lag_pollutants: [aqi, pm2_5, pm10, o3, no2]
  # Minimum fraction of a rolling window that must be present, else NaN.
  rolling_min_fraction: 0.5

training:
  # Chronological split fractions (train / val / test). Must sum to <= 1.
  train_fraction: 0.7
  validation_fraction: 0.15
  test_fraction: 0.15
  # Gap (hours) between splits to avoid leakage across the boundary.
  split_gap_hours: 72
  min_training_rows: 500
  # Time-series CV during hyperparameter search.
  cv_splits: 4
  cv_gap_hours: 24
  random_search_iterations: 20
  random_state: 42
  # Which models to train. `tensorflow` is skipped automatically if the
  # tensorflow package is not installed.
  models: [persistence, seasonal_naive, rolling_average, hour_of_day, ridge, elastic_net, random_forest, hist_gradient_boosting, tensorflow]

model_promotion:
  minimum_mae_improvement_percent: 1.0
  maximum_hazard_mae_degradation_percent: 2.0
  require_smoke_test: true

alerts:
  enabled: true          # dashboard/log alerts; external channels are opt-in
  unhealthy_threshold: 151
  very_unhealthy_threshold: 201
  hazardous_threshold: 301
  consecutive_hours: 3
  # AQI jump (points) within `spike_window_hours` that triggers a spike alert.
  spike_delta: 75
  spike_window_hours: 6
  channels: [dashboard, log]   # dashboard | log | email | webhook

monitoring:
  # Data is considered stale if the newest row is older than this.
  max_data_age_hours: 3
  # Rolling window (hours) for live MAE/RMSE monitoring.
  rolling_error_window_hours: 168
  # Population Stability Index threshold for drift warnings.
  drift_psi_threshold: 0.2

display:
  # Default dashboard timezone (users can override in the UI).
  timezone: Asia/Karachi
