# Pearls AQI Predictor — API + dashboard from one image, sharing a data volume.
#   docker compose up --build
# The dashboard talks to the API over the internal network (PEARLS_API_BASE_URL).
services:
  api:
    build: .
    image: pearls-aqi-predictor:latest
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      FEATURE_STORE_BACKEND: ${FEATURE_STORE_BACKEND:-local}
      MODEL_REGISTRY_BACKEND: ${MODEL_REGISTRY_BACKEND:-local}
    volumes:
      - pearls_data:/app/data/local
      - pearls_artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  dashboard:
    image: pearls-aqi-predictor:latest
    build: .
    command: streamlit run app/streamlit_app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Point the dashboard at the API service; falls back to direct mode if unset.
      PEARLS_API_BASE_URL: http://api:8000
    volumes:
      - pearls_data:/app/data/local
      - pearls_artifacts:/app/artifacts
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  pearls_data:
  pearls_artifacts:
