name: Training Pipeline (daily)

# Trains, evaluates, and conditionally promotes a model every day at 01:30 UTC.
# With Hopsworks configured it reads real stored features; otherwise it seeds
# sample data first so the scheduled run is self-contained and demonstrable.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      city:
        description: "City to train"
        default: "Karachi"
        required: false
      no_tune:
        description: "Disable hyperparameter search (faster)"
        default: "true"
        required: false

concurrency:
  group: training-pipeline
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    env:
      FEATURE_STORE_BACKEND: ${{ vars.FEATURE_STORE_BACKEND || 'local' }}
      MODEL_REGISTRY_BACKEND: ${{ vars.MODEL_REGISTRY_BACKEND || 'local' }}
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
      CITY: ${{ github.event.inputs.city || 'Karachi' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          if [ "$FEATURE_STORE_BACKEND" = "hopsworks" ]; then pip install -e ".[hopsworks]"; fi
      - name: Prepare config
        run: cp config/config.example.yaml config/config.yaml
      - name: Seed sample data (only when using the local store)
        if: env.FEATURE_STORE_BACKEND == 'local'
        run: python scripts/seed_sample_data.py --city "$CITY" --days 200
      - name: Train, evaluate, and (conditionally) promote
        run: |
          NO_TUNE=""
          if [ "${{ github.event.inputs.no_tune || 'true' }}" = "true" ]; then NO_TUNE="--no-tune"; fi
          python scripts/run_training_pipeline.py --city "$CITY" $NO_TUNE
      - name: Upload training report + model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-artifacts
          path: |
            artifacts/reports/**
            artifacts/models/**/metadata.json
            artifacts/models/**/metrics.json
            artifacts/models/**/model_card.md
          if-no-files-found: ignore
          retention-days: 30
