name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Prepare config
        run: cp config/config.example.yaml config/config.yaml

      - name: Ruff lint
        run: ruff check src tests scripts api app

      - name: Black format check
        run: black --check src tests scripts api app

      - name: mypy type check
        run: mypy src

      - name: Validate configuration
        run: python -c "from pearls_aqi.config import load_config; c=load_config(); print('config OK for', c.location.city)"

      - name: Validate workflow YAML
        run: python -c "import yaml,glob;[yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')];print('workflows valid')"

      - name: Run tests (no live network)
        run: pytest -m "not live" --cov=pearls_aqi --cov-report=term-missing --cov-report=xml -q

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t pearls-aqi-predictor:ci .
      - name: Smoke-test the image (import app)
        run: docker run --rm pearls-aqi-predictor:ci python -c "import api.main; print('api import OK')"
